<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель — YLWSMP</title>
    <link rel="stylesheet" href="static/style.css">
    <style>
        .admin-container { max-width: 1100px; margin: 30px auto; padding: 0 15px; }
        .admin-card { background: white; border: 2px solid #201f1a; border-radius: 14px; padding: 25px; box-shadow: 6px 6px 0 rgba(32,31,26,0.9); margin-bottom: 30px; }
        .admin-card h2 { font-family: 'MinecraftRus', Arial, sans-serif; margin-top: 0; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #faf8f0; font-weight: 700; }
        .status-badge { display: inline-block; padding: 3px 10px; border-radius: 12px; background: #eee; font-size: 12px; }
        .status-waiting { background: #f7e8a4; }
        .status-paid { background: #b8d9b0; }
        .status-completed { background: #a8c8e8; }
        .btn-chat { background: #c7a4ff; border: 2px solid #201f1a; padding: 5px 12px; border-radius: 8px; color: white; cursor: pointer; text-decoration: none; display: inline-block; font-size: 12px; box-shadow: 2px 2px 0 rgba(32,31,26,0.85); }
        .btn-chat:hover { background: #b088e0; }
        .btn-give { background: #f5c400; border: 2px solid #201f1a; padding: 5px 12px; border-radius: 8px; cursor: pointer; font-weight: bold; box-shadow: 2px 2px 0 rgba(32,31,26,0.85); }
        .btn-give:hover { background: #ffd21a; }
        .btn-paid { background: #4CAF50; border: 2px solid #201f1a; padding: 5px 12px; border-radius: 8px; color: white; cursor: pointer; box-shadow: 2px 2px 0 rgba(32,31,26,0.85); }
        .btn-paid:hover { background: #45a049; }
        .unread-badge { background: #ff6b6b; color: white; border-radius: 50%; padding: 2px 6px; font-size: 10px; margin-left: 5px; }
        .admin-form { display: flex; gap: 15px; flex-wrap: wrap; align-items: center; margin-top: 20px; }
        .admin-form input { flex: 1; min-width: 150px; padding: 10px 14px; border: 1px solid #ddd; border-radius: 10px; }
        .admin-form button { background: #f5c400; border: 2px solid #201f1a; padding: 10px 25px; border-radius: 10px; font-weight: bold; cursor: pointer; box-shadow: 3px 3px 0 rgba(32,31,26,0.85); }
        .admin-form button:active { transform: translate(3px, 3px); box-shadow: none; }
        #admin-result { margin-top: 15px; padding: 12px; border-radius: 10px; background: #f0f0f0; }
        .success-msg { background: #d4edda; color: #155724; }
        .error-msg { background: #f8d7da; color: #721c24; }
        .back-link { display: inline-block; margin-top: 15px; color: var(--yellow-dark); text-decoration: none; font-weight: 700; }
    </style>
</head>
<body>
<div class="admin-container">
    <div class="admin-card">
        <h2>📋 Все заказы</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Ник</th>
                    <th>ШАРДЫ</th>
                    <th>Сумма (₽)</th>
                    <th>Статус</th>
                    <th>Дата</th>
                    <th>Чат</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody>
                
                <tr>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td>
                        <span class="status-badge
                            status-waiting
                            status-paid
                            status-completed
                            ">
                            
                        </span>
                    </td>
                    <td></td>
                    <td>
                        
                            <a href="/admin/chat/" class="btn-chat">
                                💬 Чат
                                
                                    <span class="unread-badge"></span>
                                
                            </a>
                        
                            —
                        
                    </td>
                    <td>
                        
                            <button class="btn-paid" onclick="markPaid()">✅ Оплачен</button>
                            <button class="btn-give" onclick="giveFromOrder(, '', )">🎁 Выдать</button>
                        
                            <button class="btn-give" onclick="giveFromOrder(, '', )">🎁 Выдать</button>
                        
                            ✅ Завершён
                        
                    </td>
                </tr>
                
            </tbody>
        </table>
    </div>

    <div class="admin-card">
        <h2>⭐ Ручная выдача шардов</h2>
        <div class="admin-form">
            <input type="text" id="nickname" placeholder="Ник игрока">
            <input type="number" id="amount" placeholder="Количество" min="1">
            <button onclick="giveShards()">Выдать</button>
        </div>
        <div id="admin-result"></div>
    </div>

    <a href="index.html" class="back-link">← Вернуться в магазин</a>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const adminKey = urlParams.get('key') || '';

    async function giveShards() {
        const nickname = document.getElementById('nickname').value.trim();
        const amount = document.getElementById('amount').value;
        if (!nickname || !amount) {
            alert('Заполните все поля');
            return;
        }
        const response = await fetch('/admin/give', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-Admin-Key': adminKey },
            body: JSON.stringify({ nickname, amount: parseInt(amount) })
        });
        const data = await response.json();
        const resultDiv = document.getElementById('admin-result');
        resultDiv.className = data.ok ? 'success-msg' : 'error-msg';
        resultDiv.innerHTML = `<strong>${data.ok ? '✅ Успешно' : '❌ Ошибка'}</strong><br>${data.message}`;
        if (data.ok) setTimeout(() => location.reload(), 1500);
    }

    async function giveFromOrder(orderId, nickname, amount) {
        if (!confirm(`Выдать ${amount} шардов игроку ${nickname}?`)) return;
        const response = await fetch('/admin/give', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-Admin-Key': adminKey },
            body: JSON.stringify({ nickname, amount })
        });
        const data = await response.json();
        alert(data.ok ? `✅ Выдано ${amount} шардов ${nickname}` : `❌ Ошибка: ${data.message}`);
        if (data.ok) location.reload();
    }

    async function markPaid(orderId) {
        if (!confirm('Отметить заказ #' + orderId + ' как оплаченный?')) return;
        const response = await fetch('/admin/mark_paid', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-Admin-Key': adminKey },
            body: JSON.stringify({ order_id: orderId })
        });
        const data = await response.json();
        alert(data.ok ? '✅ Заказ отмечен оплаченным' : '❌ ' + data.message);
        if (data.ok) location.reload();
    }
</script>
</body>
</html>
